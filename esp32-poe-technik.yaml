esphome:
  name: esp32-isg
  friendly_name: ESP32-ISG

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:
  level: VERBOSE
  initial_level: NONE
  baud_rate: 0
  hardware_uart: UART1
select:
  - platform: logger
    name: "Log level"

# Enable Home Assistant API
#api:
#  encryption:
#    key: !secret api_encryption_key

ota:
  platform: esphome
#  password: !secret ota_password

substitutions:
  timezone: "Europe/Berlin"
  can_bus_bit_rate: 50kbps
  espclient_can_id: 0x680 # normal can id if not emulate FET
  #espclient_can_id: 0x401 # this is the can id of the org. FET, needed to change RAUMISTTEMP and RAUMFEUCHTE
  emulate_fet: "false" # if true, esp32 sends parameter like the org. FET
  api_reboot_timeout: 0s # default: 15min, set 0s if not using api

external_components:
  - source:
      type: local
      path: OneESP32ToRuleThemAll/components
    components: ["wp_core"]


#########################################
#                                       #
#   CAN configuration                   #
#                                       #
#########################################
canbus:
  - id: !extend wp_can
    platform: esp32_can
    tx_pin: GPIO15
    rx_pin: GPIO16
    bit_rate: 50kbps
    rx_queue_len: 512  # Default: 8, increased for high-traffic CAN bus
    tx_queue_len: 64   # Default: 16, increased for burst writes

#########################################
#                                       #
#   Buttons                             #
#                                       #
#########################################
button:
  - platform: restart
    name: "Restart ESP32-PoE Technik"

#########################################
#                                       #
#   WiFi Configuration                  #
#                                       #
#########################################
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "test_AP"
    password: "fallbackpass"
  min_auth_mode: WPA2

captive_portal:

web_server:
  port: 80
  version: 3
  log: False
  sorting_groups:
    - id: group_betriebsstatus
      name: "Betriebsstatus"
      sorting_weight: 10
    - id: group_statuswp
      name: "Status Wärmepumpe"
      sorting_weight: 20
    - id: group_temps
      name: "Temperaturen"
      sorting_weight: 30
    - id: group_heizen
      name: "Heizen"
      sorting_weight: 40
    - id: group_ww
      name: "Warmwasser"
      sorting_weight: 50
    - id: group_kuehlen
      name: "Kühlen"
      sorting_weight: 60
    - id: group_statistik
      name: "Statistik"
      sorting_weight: 70
    - id: group_verdichter
      name: "Verdichter"
      sorting_weight: 80
    - id: group_default
      name: "Allgemein"
      sorting_weight: 90

# MQTT-Einstellungen
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password


#########################################
#                                       #
#   Packages                            #
#                                       #
#########################################
packages:
