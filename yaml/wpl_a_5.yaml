#########################################
#                                       #
#   Substitutions                       #
#                                       #
#########################################
substitutions:
  can_bus_bit_rate: 50kbps

#########################################
#                                       #
#   CAN Bus                             #
#                                       #
#########################################
canbus:
  - id: !extend wp_can
    bit_rate: $can_bus_bit_rate

#########################################
#                                       #
#   ESPHome Base Setup                  #
#                                       #
#########################################
esphome:
  platformio_options:
    build_flags:
      - "-DWPL_A_5"
  on_boot:
    - priority: -50
      then:
        - lambda: |-
            CallbackHandler::instance().addCallback(std::make_pair(CanNode::Manager,Property::kBETRIEBS_STATUS),[](const SimpleVariant& value){
              const std::bitset<12U> status_bits{static_cast<std::uint16_t>(value)};
              id(HEIZKREISPUMPE_1).publish_state(status_bits.test(0U));
              id(HEIZKREISPUMPE_2).publish_state(status_bits.test(1U));
              id(Aufheizprogramm).publish_state(status_bits.test(2U));
              id(NHZStufenInBertieb).publish_state(status_bits.test(3U));
              id(WPImHeizbetrieb).publish_state(status_bits.test(4U));
              id(WPImWarmwasserbetrieb).publish_state(status_bits.test(5U));
              id(VerdichterInBetrieb).publish_state(status_bits.test(6U));
              id(SommerbetriebAktiv).publish_state(status_bits.test(7U));
              id(KuehlbetriebAktiv).publish_state(status_bits.test(8U));
              id(AbtaubetriebMin1IWS).publish_state(status_bits.test(9U));
              id(Silentmode1Aktiv).publish_state(status_bits.test(10U));
              id(Silentmode2Aktiv).publish_state(status_bits.test(11U));
            });
    - priority: -51
      then:
        - lambda: |-
            CallbackHandler::instance().addCallback(std::make_pair(CanNode::FES,Property::kHEARTBEAT),[](const SimpleVariant& value){
              const auto heartbeat = static_cast<std::uint16_t>(value);
              ESP_LOGI("REQ", "received fet heartbeat %d", heartbeat);
              sendData(wp_can, CanNode::Manager, Property::kHEARTBEAT, static_cast<std::uint16_t>(heartbeat), false);
            });
    - priority: -100
      then:
        - lambda: |-
            queueRequest(CanNode::Manager, Property::kBETRIEBS_STATUS);

    - priority: -101
      then:
      - if:
            condition:
              lambda: |-
                return ${emulate_fet};
            then:
            - delay: 15s
            - lambda: |-
                sendData(wp_can, CanNode::TBD, Property::kFET_BOARDCAST, static_cast<std::uint16_t>(0U), false, 0xFE);
            - delay: 7s
            - lambda: |-
                sendData(wp_can, CanNode::Manager, Property::kFET_INIT, static_cast<std::uint16_t>(1U), false);
            - delay: 100ms
            - lambda: |-
                sendData(wp_can, CanNode::TBD, Property::kFET_BOARDCAST, static_cast<std::uint16_t>(0U), false, 0xFE);
            - delay: 100ms
            - lambda: |-
                sendData(wp_can, CanNode::Manager, Property::kFET_SOFTWARE, static_cast<std::uint16_t>(501U), false);
            - delay: 100ms
            - lambda: |-
                sendData(wp_can, CanNode::Manager, Property::kFET_SOFTWARESTAND, static_cast<std::uint16_t>(2U), false);
            - delay: 100ms
            - lambda: |-
                sendData(wp_can, CanNode::Manager, Property::kFET_REVISIONSNUMMER, static_cast<std::uint16_t>(3U), false);
            - delay: 1s
            - lambda: |-
                sendData(wp_can, CanNode::Manager, Property::kFET_SOFTWARE, static_cast<std::uint16_t>(501U), false);
            - delay: 100ms
            - lambda: |-
                sendData(wp_can, CanNode::Manager, Property::kFET_SOFTWARESTAND, static_cast<std::uint16_t>(2U), false);
            - delay: 100ms
            - lambda: |-
                sendData(wp_can, CanNode::Manager, Property::kFET_REVISIONSNUMMER, static_cast<std::uint16_t>(3U), false);


interval:
  - interval: $interval_medium
    then:
        - lambda: |-
            queueRequest(CanNode::Manager, Property::kBETRIEBS_STATUS);

  - interval: $interval_medium
    then:
        - lambda: |-
            uint8_t val = 1;
            //queueTransmission(CanNode::Manager, Property::kHEARTBEAT, static_cast<std::uint16_t>(val));
            //sendData(wp_can, CanNode::Manager, Property::kHEARTBEAT, static_cast<std::uint16_t>(val), false);

  - interval: $interval_medium
    then:
      - lambda: |-
          // Wir senden den aktuellen Wert der Number-Entität noch einmal auf den Bus
          float temp = id(external_temperature_sensor).state;
          if (temp > 0.0f) {
              temp = round(temp * 10.0f)/10.0f;
              ESP_LOGI("SET", "Sending room temperature %f to heatpump", temp);
              queueTransmission(CanNode::HK1, Property::kRAUMISTTEMP, static_cast<std::uint16_t>(temp * 10.0f));
          }

          float humidity = id(external_humidity_sensor).state;
          if (humidity > 0.0f) {
              humidity = round(humidity * 10.0f)/10.0f;
              ESP_LOGI("SET", "Sending humidity %f to heatpump", humidity);
              queueTransmission(CanNode::HK1, Property::kRAUMFEUCHTE, static_cast<std::uint16_t>(humidity * 10.0f));
            }


