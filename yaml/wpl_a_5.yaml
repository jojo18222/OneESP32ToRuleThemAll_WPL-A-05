text:
  - id: !extend HK1_CAN_ID
    initial_value: "0x601"
  - id: !extend HK2_CAN_ID
    initial_value: "0x602"
  - id: !extend Heizmodul_CAN_ID
    initial_value: "0x514"

sensor:
  - platform: uptime  # Betriebszeit des ESP
    id: uptime_sensor
    update_interval: 10s

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

text_sensor:
  - platform: template
    name: "Uptime"
    lambda: |-
      int seconds = id(uptime_sensor).state;
      int days = seconds / 86400;
      int hours = (seconds % 86400) / 3600;
      int minutes = (seconds % 3600) / 60;
      int secs = seconds % 60;
      return to_string(days) + "d:" + to_string(hours) + "h:" + to_string(minutes) + "m:" + to_string(secs) + "s";
    update_interval: 30s
    entity_category: diagnostic


